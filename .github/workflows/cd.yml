name: CD - Deploy Azure

on:
  workflow_run:
    workflows:
      - Build and deploy Node.js app to Azure Web App - autoprime-devops
    types: [completed]

jobs:
  e2e:
    name: Testes Cypress
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Roda testes Cypress
        uses: cypress-io/github-action@v6
        with:
          config: baseUrl=https://autoprime-devops-hjcmabbxckebascb.canadacentral-01.azurewebsites.net